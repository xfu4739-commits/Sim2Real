dataset:
  # Full-data synthetic-satellite experiment; this is not an exact paper reproduction.
  sim_root_dir: 'C:/Users/10115/Datasets/Sim2Real-Fire/sim_full'
  real_root_dir: 'C:/Users/10115/Datasets/Sim2Real-Fire/real_full'
  vis_dir: 'C:/Users/10115/Datasets/Sim2Real-Fire/vis/synsat'
  train_dir: 'Satellite_Images_Mask'
  val_dir: 'Satellite_Images_Mask'
  trainwxs_dir: 'Weather_Data'
  valwxs_dir: 'Weather_Data'
  topo_dir: 'Topography_Map'
  vege_dir: 'Vegetation_Map'
  fuel_dir: 'Fuel_Map'
  sim_satellite_file: 'satellite_image.png'
  satellite_fusion:
    enabled: true
    style: burn-scar
    match_radiometry: true
    hotspots: true
    alpha: 0.85
    fire_color: [255, 80, 0]
  real_satellite_dir: 'Satellite_Images'
  test_dir: 'Satellite_Images_Mask'
  testwxs_dir: 'Weather_Data'
  input_length: 3
  img_size: [256, 256]
  reverse: true
  num_classes: 2
  num_workers: 4
  environment_cache_size: 8
  sim_split:
    enabled: true
    val_ratio: 0.2
    seed: 12345

FireTr:
  input_length: 3
  img_size: [256, 256]
  Encoder:
    hidden_dim: 96
    downscaling_factors: [4, 2, 2]
    layers: [2, 2, 2]
    heads: [3, 6, 12]
    head_dim: 32
    window_size: 8
    relative_pos_embedding: true
    # topography=4 (aspect sin/cos), vegetation=6, fuel=10, RGB frames=9
    modal_channel: 29
    environment_category_cardinality: 65537
  Spatial: {embed_dim: 384, num_heads: 4, hidden_dim: 512}
  Temporal: {embed_dim: 384, num_heads: 4, hidden_dim: 512}
  Time: {embed_dim: 384, num_heads: 4, hidden_dim: 512}

training:
  # Per-GPU batch semantics intentionally unchanged in this repair.
  batch_size: 4
  learning_rate: 0.0001
  epochs: 10

checkpoint:
  checkpoint: false
  checkpoint_path: 'output/models/synsat/best_iou.pth'
  model_save_path: 'output/models/synsat'
  resume: false
  resume_path: 'output/models/synsat/last.pth'
  save_interval: 5
  keep_last_n: 3

logging:
  log_dir: 'output/logs/synsat'
